# 容器内 nginx：只负责静态文件与前端路由，TLS 和域名由 Dokploy 的 Traefik 处理
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 健康检查端点，供 HEALTHCHECK 与 Traefik 探活使用
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # 单页应用路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带内容哈希的静态资源长期缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1k;
}
